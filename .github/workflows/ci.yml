name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WorkFlow360.sln

      - name: Build
        run: dotnet build WorkFlow360.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WorkFlow360.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/workflow360-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/workflow360-angular/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npm test -- --watch=false
